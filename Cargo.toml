[workspace]
resolver = "3"
members = ["crates/texscan-core", "crates/texscan-cli", "crates/texscan-fixtures", "crates/texscan-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
texscan-core = { path = "crates/texscan-core" }
texscan-fixtures = { path = "crates/texscan-fixtures" }
anyhow = "1"
bcdec_rs = "0.2"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.4"
memchr = "2"
memmap2 = "0.9"
png = "0.18"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
