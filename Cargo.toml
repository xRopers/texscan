[workspace]
resolver = "3"
members = ["crates/texscan-core", "crates/texscan-cli", "crates/texscan-fixtures", "crates/texscan-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
texscan-core = { path = "crates/texscan-core" }
texscan-fixtures = { path = "crates/texscan-fixtures" }
anyhow = "1"
bcdec_rs = "0.2"
block_compression = { version = "0.10", default-features = false, features = ["bc15", "bc6h", "bc7"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1.4"
memchr = "2"
memmap2 = "0.9"
miniz_oxide = "0.8"
png = "0.18"
rayon = "1"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
texture2ddecoder = "0.1.2"
thiserror = "2"
